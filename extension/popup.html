<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Humour Hub</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body class="popup">
  <header class="popup-header"><div class="brand"><img src="icon.png" alt=""><div><strong>Humour Hub</strong><small>Memes, made clearer</small></div></div><button id="openWorkspace" class="icon-button" aria-label="Open full workspace" title="Open workspace">↗</button></header>
  <main class="popup-main">
    <div id="status" class="service-status" role="status">Checking service…</div>
    <label for="memeText">Meme text</label>
    <textarea id="memeText" maxlength="4000" placeholder="Paste a caption or a meme description"></textarea>
    <label class="file-label" for="imageFile">Add or paste an image <span>PNG, JPEG, WebP · 5 MB max</span></label>
    <input id="imageFile" type="file" accept="image/png,image/jpeg,image/webp">
    <img id="preview" class="image-preview hidden" alt="Selected meme image">
    <div class="form-row"><label for="language">Language</label><select id="language"><option value="en">English</option><option value="hi">Hindi</option><option value="hinglish">Hinglish</option></select></div>
    <details><summary>Remix options</summary><div class="option-grid"><label>Topic<input id="topic" maxlength="80" placeholder="e.g. exams"></label><label>Tone<select id="tone"><option value="general">General</option><option value="student">Student</option><option value="work">Work</option><option value="gaming">Gaming</option><option value="wholesome">Wholesome</option></select></label></div></details>
    <div class="action-row"><button id="explain" class="primary">Explain</button><button id="remix" class="secondary">Remix × 3</button></div>
    <p id="quota" class="muted" aria-live="polite"></p>
    <section class="result-card" aria-live="polite"><h2>Result</h2><div id="result" class="result-text">Your explanation or remixes will appear here.</div><button id="saveFavorite" class="text-button hidden">Save to favorites</button></section>
    <button id="openEditor" class="wide-secondary">Open editor and library <span aria-hidden="true">→</span></button>
  </main>
  <script type="module" src="/src/popup.ts"></script>
</body>
</html>
