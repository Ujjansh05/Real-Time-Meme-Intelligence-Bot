name: Collect observed trends

on:
  schedule:
    - cron: '7,37 * * * *'
    - cron: '14 12 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: Source set to collect
        required: true
        type: choice
        options: [all, social, wikipedia]
        default: all

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      REDDIT_API_APPROVED: ${{ vars.REDDIT_API_APPROVED }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT }}
      REDDIT_COMMUNITIES: ${{ vars.REDDIT_COMMUNITIES }}
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      BLUESKY_QUERIES: ${{ vars.BLUESKY_QUERIES }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect social sources
        if: (github.event.schedule == '7,37 * * * *' || inputs.source == 'all' || inputs.source == 'social') && (env.REDDIT_API_APPROVED == 'true' || env.BLUESKY_HANDLE != '')
        run: python Backend/trend_collect.py --source social
      - name: Collect Wikipedia interest once daily
        if: github.event.schedule == '14 12 * * *' || inputs.source == 'all' || inputs.source == 'wikipedia'
        run: python Backend/trend_collect.py --source wikipedia
