services:
  - type: web
    name: humour-hub-api
    runtime: python
    plan: free
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /api/v1/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TRUST_PROXY_HEADERS
        value: 'true'
      - key: AI_DISABLED
        sync: false
